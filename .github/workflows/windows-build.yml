name: Windows Build

on:
  # Manual build only. Never triggers on push / pull_request / schedule.
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# Builds the self-contained Windows x64 ZIP by cross-compiling from Linux with
# the repository's own build interface:
#
#   ./scripts/build.sh --target windows-x86_64 --config Release --package zip
#
# This used to be an MSVC build on windows-latest. That path could not ship
# the native RAW engine (src/rawengine/ is RawTherapee's rtengine, which
# upstream only supports on Windows through MinGW, and which has never been
# built with MSVC here), so the published Windows package lacked RAW support,
# Hazor Develop and Lens Corrections. The MinGW-w64 target in scripts/build/
# already provisions and packages the full feature set — Qt 6.8.3 win64_mingw,
# OpenCV, ONNX Runtime (CPU/CUDA/TensorRT providers), the nine RawEngine
# libraries plus a private glib for lensfun, rtdata, the lensfun database,
# RealESRGAN and the bundled models — so CI now runs exactly that, instead of a
# second YAML-only definition that drifted from it. See docs/BUILD.md
# ("Windows cross-toolchain" and "RawEngine dependencies").
#
# Final layout inside the ZIP (package_windows_zip() in scripts/build/package.sh):
#   Hazor.exe + Qt/OpenCV/ONNX Runtime/exiv2/MinGW runtime DLLs
#   platforms\ imageformats\ iconengines\ styles\        (Qt plugins)
#   share\lensfun\version_1\                             (Lens Corrections db)
#   3rdparty\onnx\models\...                             (bundled models)
#   3rdparty\realesrgan\...                              (RealESRGAN + weights)
#   3rdparty\rawengine\rtdata\...                        (RAW engine data)
#   licenses\
#
# Cost: the first run builds the GCC 13.1 cross toolchain from source (Qt's
# win64_mingw libraries need exactly that ABI and Ubuntu packages none), which
# takes about an hour. It is cached on its own key, so later runs only pay for
# the dependencies that changed and for Hazor itself.
# ─────────────────────────────────────────────────────────────────────────────

env:
  HAZOR_TARGET: windows-x86_64
  HAZOR_CONFIG: Release
  # Bump to force-invalidate every cache below.
  CACHE_VERSION: v2
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "1"

jobs:
  build-windows:
    name: Build Windows x64 (MinGW-w64 cross)
    # 22.04 is the host docs/BUILD.md describes for the cross toolchain build.
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Enforce main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "::error::This workflow must run from the 'main' branch (got '$GITHUB_REF_NAME')."
            exit 1
          fi
          echo "Running from branch: $GITHUB_REF_NAME"

      - name: Checkout
        uses: actions/checkout@v4

      # The toolchain build tree, the target Qt (~1 GB), OpenCV's build tree and
      # the Hazor build together outgrow the runner's default free space.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # What scripts/build/ needs from the host. flex/bison/texinfo and the
      # gmp/mpfr/mpc headers are the GCC bootstrap's requirements
      # (mingw_toolchain_requirements() in prepare.sh); python3-venv serves aqt
      # and meson, which prepare.sh installs into private venvs.
      - name: Install host packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            ninja-build pkg-config python3-venv \
            curl git unzip zip file ccache

      # lensfun 0.3.4 configures only with CMake < 4 (see prepare.sh), so the
      # runner's preinstalled CMake is not relied upon.
      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"

      - name: Compute cache keys
        id: keys
        shell: bash
        run: |
          # The toolchain only depends on its pinned versions and on the
          # function that builds it, so editing any other dependency does not
          # throw away an hour of GCC.
          toolchain="$( {
            grep '^readonly HAZOR_MINGW_' scripts/build/versions.sh
            sed -n '/^mingw_toolchain_requirements()/,/^dependency_cmake_args()/p' scripts/build/prepare.sh
          } | sha256sum | cut -c1-16 )"
          # Prepared dependencies are matched exactly: several RawEngine
          # prefixes carry no version in their path, so a partial restore of
          # an older set would be reused silently after a version bump.
          deps="${{ hashFiles('scripts/build/versions.sh', 'scripts/build/prepare.sh', 'scripts/build/common.sh', 'cmake/toolchains/windows-mingw-x86_64.cmake', 'src/rawengine/rtengine/camconst.json') }}"
          {
            echo "toolchain=${HAZOR_TARGET}-mingw-${toolchain}-${CACHE_VERSION}"
            echo "deps=${HAZOR_TARGET}-deps-${deps}-${CACHE_VERSION}"
            echo "downloads=${HAZOR_TARGET}-downloads-${deps}-${CACHE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore MinGW-w64 toolchain cache
        id: cache_toolchain
        uses: actions/cache/restore@v4
        with:
          path: 3rdparty/toolchains
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Restore prepared dependencies cache
        id: cache_deps
        uses: actions/cache/restore@v4
        with:
          path: |
            3rdparty/host
            3rdparty/common
            3rdparty/targets/windows-x86_64
          key: ${{ steps.keys.outputs.deps }}

      # Every download is checksum- or commit-verified by fetch_checked() /
      # checkout_pinned_source(), so an older downloads cache is safe to reuse.
      - name: Restore downloads cache
        id: cache_downloads
        uses: actions/cache/restore@v4
        with:
          path: 3rdparty/downloads
          key: ${{ steps.keys.outputs.downloads }}
          restore-keys: |
            ${{ env.HAZOR_TARGET }}-downloads-

      # --verify-only --no-verify is "prepare and stop": no Hazor build, no
      # package, no verification of a build that does not exist yet. Splitting
      # it from the build lets the caches below be saved even if Hazor fails.
      - name: Prepare dependencies
        shell: bash
        run: |
          ./scripts/build.sh --target "$HAZOR_TARGET" --config "$HAZOR_CONFIG" \
            --prepare --verify-only --no-verify

      - name: Save MinGW-w64 toolchain cache
        if: ${{ !cancelled() && steps.cache_toolchain.outputs.cache-hit != 'true' && hashFiles('3rdparty/toolchains/*/x86_64-w64-mingw32/lib/libstdc++.a') != '' }}
        uses: actions/cache/save@v4
        with:
          path: 3rdparty/toolchains
          key: ${{ steps.keys.outputs.toolchain }}

      - name: Save prepared dependencies cache
        if: ${{ steps.cache_deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            3rdparty/host
            3rdparty/common
            3rdparty/targets/windows-x86_64
          key: ${{ steps.keys.outputs.deps }}

      - name: Save downloads cache
        if: ${{ !cancelled() && steps.cache_downloads.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: 3rdparty/downloads
          key: ${{ steps.keys.outputs.downloads }}

      # Only the installed prefixes are needed from here on; the dependency
      # build trees (GCC's alone is several GB) are what a resumed prepare
      # would reuse, and the caches above already hold the results.
      - name: Drop dependency build trees
        shell: bash
        run: |
          rm -rf 3rdparty/build-deps/windows-x86_64
          df -h /

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ env.HAZOR_TARGET }}-ccache-${{ github.run_id }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            ${{ env.HAZOR_TARGET }}-ccache-

      # Builds Hazor.exe, assembles dist/windows-x86_64 and the ZIP, then runs
      # scripts/build/verify.sh: PE32+ x86-64 format, dependency paths inside
      # the target prefix, and no reference back to this checkout in the
      # package.
      - name: Build and package
        shell: bash
        run: |
          ccache --zero-stats || true
          ./scripts/build.sh --target "$HAZOR_TARGET" --config "$HAZOR_CONFIG" \
            --package zip
          ccache --show-stats || true

      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ env.HAZOR_TARGET }}-ccache-${{ github.run_id }}-${{ env.CACHE_VERSION }}

      - name: Check packaged feature set
        shell: bash
        run: |
          set -euo pipefail
          # CMakeLists.txt only warns and carries on when an optional feature's
          # dependencies are missing, so check what was actually compiled in:
          # the defines on Hazor's own compile lines.
          ninja_file="build/$HAZOR_TARGET-release/build.ninja"
          grep -q -- '-DHAVE_ONNXRUNTIME=1' "$ninja_file" \
            || { echo "::error::Hazor was built without ONNX Runtime"; exit 1; }
          grep -q -- '-DHAVE_RAWENGINE=1' "$ninja_file" \
            || { echo "::error::Hazor was built without the RAW engine"; exit 1; }
          dist="dist/$HAZOR_TARGET"
          for item in \
            Hazor.exe Qt6Core.dll Qt6Gui.dll Qt6Widgets.dll platforms/qwindows.dll \
            onnxruntime.dll \
            3rdparty/onnx/models/segmenters/sam-mobile/model.json \
            3rdparty/onnx/models/matting/BiRefNet_lite-ONNX/model.json \
            3rdparty/realesrgan/realesrgan-ncnn-vulkan.exe \
            3rdparty/rawengine/rtdata/camconst.json \
            3rdparty/rawengine/rtdata/iccprofiles/output/RTv4_sRGB.icc \
            share/lensfun/version_1; do
            [[ -e "$dist/$item" ]] || { echo "::error::Missing from the package: $item"; exit 1; }
          done
          ls "$dist"/libexiv2*.dll >/dev/null \
            || { echo "::error::Missing from the package: libexiv2*.dll"; exit 1; }
          zip="$(find "artifacts/$HAZOR_TARGET" -maxdepth 1 -name 'HazorStudio-Windows-x64-v*.zip' -print -quit)"
          [[ -n "$zip" ]] || { echo "::error::Windows ZIP not found under artifacts/$HAZOR_TARGET"; exit 1; }
          echo "ZIP_PATH=$zip" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$(basename "$zip" .zip)" >> "$GITHUB_ENV"
          ls -lh "$zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 14
